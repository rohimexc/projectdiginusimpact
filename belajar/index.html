<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Belajar JS: Form & Manipulasi Data</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6 font-sans">

  <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md mb-8">
    <h2 class="text-2xl font-bold mb-4 text-gray-800 border-b pb-2">Form Tambah Data Siswa</h2>
    
    <!-- FORM & EVENT LISTENER SUBMIT -->
    <form id="siswaForm" class="space-y-4">
      <div>
        <!-- INPUT TEXT & EVENT INPUT -->
        <label for="inputNama" class="block text-sm font-medium text-gray-700">Nama Siswa:</label>
        <input type="text" id="inputNama" required class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
        <small id="namaPreview" class="text-xs text-gray-500 mt-1 block h-4"></small>
      </div>

      <div>
        <!-- SELECT / OPTION & EVENT CHANGE -->
        <label for="selectJurusan" class="block text-sm font-medium text-gray-700">Jurusan:</label>
        <select id="selectJurusan" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
          <option value="RPL">RPL</option>
          <option value="TKJ">TKJ</option>
          <option value="MM">Multimedia</option>
        </select>
      </div>

      <div>
        <!-- RADIO BUTTON & EVENT CHANGE -->
        <label class="block text-sm font-medium text-gray-700 mb-1">Gender:</label>
        <div class="flex items-center space-x-4">
          <label class="inline-flex items-center text-sm text-gray-700">
            <input type="radio" name="gender" id="genderL" value="Laki-laki" checked class="text-indigo-600 focus:ring-indigo-500">
            <span class="ml-2">Laki-laki</span>
          </label>
          <label class="inline-flex items-center text-sm text-gray-700">
            <input type="radio" name="gender" id="genderP" value="Perempuan" class="text-indigo-600 focus:ring-indigo-500">
            <span class="ml-2">Perempuan</span>
          </label>
        </div>
      </div>

      <div>
        <!-- CHECKBOX & EVENT CHANGE -->
        <label for="checkAktif" class="inline-flex items-center text-sm font-medium text-gray-700">
          <input type="checkbox" id="checkAktif" checked class="rounded text-indigo-600 focus:ring-indigo-500">
          <span class="ml-2">Status Aktif</span>
        </label>
      </div>

      <button type="submit" class="w-full bg-indigo-600 text-white py-2 px-4 rounded-md hover:bg-indigo-700 transition duration-200">Tambah Data</button>
    </form>
  </div>

  <div class="max-w-4xl mx-auto bg-white p-6 rounded-lg shadow-md">
    <h2 class="text-2xl font-bold mb-4 text-gray-800 border-b pb-2">Pencarian & Aksi Data</h2>
    
    <div class="flex flex-wrap gap-2 mb-6">
      <input type="text" id="inputCari" placeholder="Cari berdasarkan nama..." class="flex-1 min-w-[200px] px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
      <button id="btnCari" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition duration-200">Cari</button>
      <button id="btnUbah" class="bg-yellow-500 text-white px-4 py-2 rounded-md hover:bg-yellow-600 transition duration-200">Ubah Data Pertama</button>
      <button id="btnHapus" class="bg-red-600 text-white px-4 py-2 rounded-md hover:bg-red-700 transition duration-200">Hapus Data Pertama</button>
      <button id="btnCekKey" class="bg-gray-700 text-white px-4 py-2 rounded-md hover:bg-gray-800 transition duration-200">Cek Key Object</button>
    </div>

    <h2 class="text-xl font-bold mb-3 text-gray-800">Daftar Siswa (Array of Objects)</h2>
    <div class="overflow-x-auto">
      <table class="min-w-full divide-y divide-gray-200">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nama</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Jurusan</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Gender</th>
            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
          </tr>
        </thead>
        <tbody id="tabelSiswa" class="bg-white divide-y divide-gray-200"></tbody>
      </table>
    </div>
  </div>

  <!-- File JavaScript External -->
  <script src="script.js"></script>
</body>
</html>
