<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfirmasi Hapus</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-6 rounded-2xl border max-w-md w-full text-center shadow-sm">
        <h2 class="text-xl font-bold text-slate-900 mb-2">Hapus Berita?</h2>
        <p class="text-sm text-slate-600 mb-6">Yakin ingin menghapus berita "<strong>{{ berita.judul }}</strong>"? Data yang dihapus tidak dapat dipulihkan.</p>
        <form method="POST" class="flex justify-center gap-3">
            {% csrf_token %}
            <a href="{% url 'berita_detail' berita.pk %}" class="px-4 py-2 border rounded-xl text-slate-600 text-sm">Batal</a>
            <button type="submit" class="px-5 py-2 bg-red-600 text-white font-bold rounded-xl hover:bg-red-700 text-sm">Ya, Hapus</button>
        </form>
    </div>
</body>
</html>
