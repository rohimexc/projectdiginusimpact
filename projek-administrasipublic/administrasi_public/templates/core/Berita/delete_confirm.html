{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konfirmasi Hapus Berita - Admin Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { poppins: ['Poppins', 'sans-serif'] },
          colors: {
            brand: { teal: '#0b7285', darkteal: '#084c5a' }
          }
        }
      }
    }
  </script>
</head>
<body class="font-poppins bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-200/80 p-8 text-center">
    <!-- Icon Peringatan -->
    <div class="w-16 h-16 rounded-2xl bg-rose-50 text-rose-600 mx-auto flex items-center justify-center text-2xl mb-4 border border-rose-100">
      <i class="fas fa-trash-can"></i>
    </div>

    <h2 class="text-lg font-bold text-slate-800 mb-2">Hapus Berita?</h2>
    <p class="text-xs text-slate-500 mb-6 leading-relaxed">
      Apakah Anda yakin ingin menghapus postingan <br>
      <span class="font-bold text-slate-800">"{{ berita.judul }}"</span>?<br>
      Tindakan ini tidak dapat dibatalkan.
    </p>

    <form method="POST" class="flex items-center justify-center gap-3">
      {% csrf_token %}
      <!-- Tombol Batal Kembali ke Kelola Berita -->
      <a href="{% url 'admin_kelola_berita' %}" class="w-1/2 py-2.5 px-4 rounded-xl border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 transition">
        Batal
      </a>
      <!-- Tombol Hapus -->
      <button type="submit" class="w-1/2 py-2.5 px-4 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold shadow transition">
        Ya, Hapus
      </button>
    </form>
  </div>

</body>
</html>
