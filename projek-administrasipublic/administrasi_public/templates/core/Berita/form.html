<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-6 flex justify-center items-center min-h-screen">
    <div class="bg-white p-8 rounded-2xl border max-w-xl w-full shadow-sm">
        <h1 class="text-2xl font-bold mb-6 text-slate-900">{{ title }}</h1>
        <form method="POST" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="flex justify-end gap-3 pt-4">
                <a href="{% url 'berita_list' %}" class="px-4 py-2 border rounded-xl text-slate-600 text-sm">Batal</a>
                <button type="submit" class="px-5 py-2 bg-blue-900 text-white font-bold rounded-xl hover:bg-blue-800 text-sm">Simpan</button>
            </div>
        </form>
    </div>
</body>
</html>
