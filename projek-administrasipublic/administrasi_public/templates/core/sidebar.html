{% load static %}
<!-- SIDEBAR ADMIN TERPUSAT (5 MENU SAJA) -->
<aside class="w-64 bg-[#05313a] text-white flex flex-col justify-between shrink-0 shadow-xl hidden md:flex min-h-screen sticky top-0">
  <div>
    <!-- Logo & Nama Portal -->
    <div class="p-6 border-b border-white/10 flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center text-amber-400 text-lg border border-white/20">
        <i class="bi bi-bank2"></i>
      </div>
      <div>
        <h2 class="text-sm font-bold leading-tight">Admin Portal</h2>
        <p class="text-[10px] text-slate-300">FISIP UNTAD</p>
      </div>
    </div>

    <!-- 5 MENU UTAMA -->
    <nav class="p-4 space-y-1.5 text-xs">
      <!-- 1. Dashboard -->
      <a href="{% url 'admin_dashboard' %}" class="flex items-center gap-3 px-4 py-3 rounded-xl transition {% if request.resolver_match.url_name == 'admin_dashboard' %}bg-white/15 text-amber-400 font-semibold{% else %}text-slate-300 hover:bg-white/10 hover:text-white{% endif %}">
        <i class="bi bi-pie-chart-fill w-4"></i>
        <span>1. Dashboard</span>
      </a>

      <!-- 2. Manajemen User -->
      <a href="{% url 'admin_kelola_user' %}" class="flex items-center gap-3 px-4 py-3 rounded-xl transition {% if request.resolver_match.url_name == 'admin_kelola_user' or 'user' in request.resolver_match.url_name %}bg-white/15 text-amber-400 font-semibold{% else %}text-slate-300 hover:bg-white/10 hover:text-white{% endif %}">
        <i class="bi bi-person-gear w-4"></i>
        <span>2. Manajemen User</span>
      </a>

      <!-- 3. Manajemen Berita -->
      <a href="{% url 'admin_kelola_berita' %}" class="flex items-center gap-3 px-4 py-3 rounded-xl transition {% if 'berita' in request.resolver_match.url_name %}bg-white/15 text-amber-400 font-semibold{% else %}text-slate-300 hover:bg-white/10 hover:text-white{% endif %}">
        <i class="bi bi-newspaper w-4"></i>
        <span>3. Manajemen Berita</span>
      </a>

      <!-- 4. Manajemen Dosen -->
      <a href="{% url 'admin_kelola_dosen' %}" class="flex items-center gap-3 px-4 py-3 rounded-xl transition {% if 'dosen' in request.resolver_match.url_name %}bg-white/15 text-amber-400 font-semibold{% else %}text-slate-300 hover:bg-white/10 hover:text-white{% endif %}">
        <i class="bi bi-person-video3 w-4"></i>
        <span>4. Manajemen Dosen</span>
      </a>

      <!-- 5. Manajemen Tendik -->
      <a href="{% url 'admin_kelola_tendik' %}" class="flex items-center gap-3 px-4 py-3 rounded-xl transition {% if 'tendik' in request.resolver_match.url_name %}bg-white/15 text-amber-400 font-semibold{% else %}text-slate-300 hover:bg-white/10 hover:text-white{% endif %}">
        <i class="bi bi-people-fill w-4"></i>
        <span>5. Manajemen Tendik</span>
      </a>
    </nav>
  </div>

  <!-- Logout Bagian Bawah -->
  <div class="p-4 border-t border-white/10">
    <a href="{% url 'user_logout' %}" class="flex items-center justify-center gap-2 w-full py-2.5 rounded-xl bg-rose-500/20 text-rose-300 hover:bg-rose-500 hover:text-white text-xs font-semibold transition">
      <i class="bi bi-box-arrow-left"></i>
      <span>Keluar (Logout)</span>
    </a>
  </div>
</aside>
