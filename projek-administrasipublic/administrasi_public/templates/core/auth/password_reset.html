{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Kata Sandi - Admin Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="font-['Poppins'] bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-200/80 p-8 sm:p-10">
    <div class="text-center mb-6">
      <div class="w-14 h-14 bg-teal-50 text-teal-800 rounded-2xl mx-auto flex items-center justify-center text-2xl mb-3 border border-teal-100">
        <i class="bi bi-key-fill"></i>
      </div>
      <h2 class="text-xl font-bold text-slate-800">Lupa Kata Sandi?</h2>
      <p class="text-xs text-slate-500 mt-1">Masukkan alamat email Anda untuk menerima instruksi pemulihan kata sandi.</p>
    </div>

    <form method="POST" class="space-y-4 text-xs">
      {% csrf_token %}
      <div>
        <label class="block font-semibold text-slate-700 mb-1.5">Alamat Email Terdaftar</label>
        <div class="relative flex items-center">
          <i class="bi bi-envelope absolute left-3.5 text-slate-400"></i>
          <input 
            type="email" 
            name="email" 
            required 
            placeholder="nama@untad.ac.id" 
            class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:bg-white focus:border-teal-700 transition"
          >
        </div>
      </div>

      <button type="submit" class="w-full py-3 bg-teal-800 hover:bg-teal-900 text-white font-semibold rounded-xl transition shadow">
        Kirim Link Pemulihan
      </button>
    </form>

    <div class="mt-6 text-center border-t border-slate-100 pt-4">
      <a href="{% url 'user_login' %}" class="text-xs text-slate-400 hover:text-teal-800 transition inline-flex items-center gap-1.5 font-medium">
        <i class="bi bi-arrow-left"></i> Kembali ke Halaman Login
      </a>
    </div>
  </div>

</body>
</html>
