{% load static %}
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instruksi Terkirim - Admin Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="font-['Poppins'] bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-white rounded-3xl shadow-xl border border-slate-200/80 p-8 text-center">
    <div class="w-14 h-14 bg-emerald-50 text-emerald-600 rounded-2xl mx-auto flex items-center justify-center text-2xl mb-4 border border-emerald-100">
      <i class="bi bi-send-check-fill"></i>
    </div>
    <h2 class="text-lg font-bold text-slate-800 mb-2">Email Pemulihan Terkirim</h2>
    <p class="text-xs text-slate-500 mb-6 leading-relaxed">
      Jika email yang Anda masukkan terdaftar, tautan pemulihan kata sandi telah dikirimkan.
    </p>
    <a href="{% url 'user_login' %}" class="inline-block py-2.5 px-6 bg-teal-800 hover:bg-teal-900 text-white text-xs font-semibold rounded-xl transition">
      Kembali ke Login
    </a>
  </div>

</body>
</html>
