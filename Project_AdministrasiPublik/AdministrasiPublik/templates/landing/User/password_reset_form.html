<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - User Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen">

    <div class="max-w-md w-full mx-4 bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
        <div class="text-center space-y-2">
            <h2 class="text-xl font-bold text-slate-800">Atur Ulang Password</h2>
            <p class="text-xs text-slate-500">Masukkan alamat email akun kamu. Kami akan mengirimkan tautan untuk mereset password.</p>
        </div>

        <form method="POST" class="space-y-4 text-xs">
            {% csrf_token %}
            
            {% for field in form %}
                <div class="space-y-1">
                    <label class="block font-semibold text-slate-700">{{ field.label }}</label>
                    <input type="{{ field.field.widget.input_type }}" name="{{ field.name }}" id="{{ field.id_for_label }}" required class="w-full px-3 py-2 text-xs bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-600 focus:bg-white transition" placeholder="nama@email.com">
                    {% if field.errors %}
                        <p class="text-red-500 text-[11px]">{{ field.errors.0 }}</p>
                    {% endif %}
                </div>
            {% endfor %}

            <button type="submit" class="w-full py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-semibold rounded-lg transition shadow-sm">Kirim Tautan Reset</button>
        </form>

        <div class="text-center pt-2">
            <a href="{% url 'landing:login' %}" class="text-xs text-teal-600 hover:underline font-medium">Kembali ke Halaman Login</a>
        </div>
    </div>

</body>
</html>
