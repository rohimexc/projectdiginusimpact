<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lupa Password - Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { tealBrand: '#0b7a75' } } } }
    </script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white p-8 rounded-2xl border border-slate-200 shadow-sm space-y-6">
        <div class="text-center space-y-1">
            <h2 class="text-lg font-bold text-slate-800">Lupa Password Admin?</h2>
            <p class="text-xs text-slate-400">Masukkan email akun Anda untuk mendapatkan tautan reset password.</p>
        </div>

        <form method="POST" class="space-y-4 text-xs">
            {% csrf_token %}
            {% for field in form %}
            <div class="space-y-1">
                <label class="block font-semibold text-slate-700">{{ field.label }}</label>
                <input type="email" name="{{ field.name }}" required class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-600 transition" placeholder="nama@email.com">
                {% if field.errors %}
                    <p class="text-red-500 text-[11px]">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
            {% endfor %}

            <button type="submit" class="w-full py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-semibold rounded-lg transition shadow-sm">
                Kirim Tautan Reset
            </button>
        </form>

        <div class="text-center pt-2 border-t border-slate-100">
            <a href="{% url 'landing:login' %}" class="text-xs font-semibold text-teal-600 hover:underline">&larr; Kembali ke Halaman Login</a>
        </div>
    </div>
</body>
</html>
