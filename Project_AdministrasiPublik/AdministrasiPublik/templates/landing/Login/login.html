<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Administrasi Publik</title>
    <!-- Tailwind CSS CDN (Pastikan sesuaikan jika pakai Tailwind lokal) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tealBrand: '#0b7a75',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center">

    <div class="max-w-md w-full bg-white rounded-2xl shadow-sm border border-slate-200 p-8 space-y-6 m-4">
        
        <!-- Header / Logo -->
        <div class="text-center space-y-2">
            <h2 class="text-2xl font-bold text-tealBrand">Login Portal</h2>
            <div class="w-12 h-1 bg-amber-400 mx-auto rounded-full"></div>
            <p class="text-slate-500 text-xs">Silakan masuk sesuai dengan akun hak akses Anda</p>
        </div>

        <!-- Notifikasi Pesan Error / Success -->
        {% if messages %}
            {% for message in messages %}
                <div class="p-3 text-xs rounded-lg {% if message.tags == 'error' %}bg-red-50 text-red-700 border border-red-200{% else %}bg-teal-50 text-teal-700 border border-teal-200{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <!-- Form Login -->
        <form class="space-y-4" method="POST" action="">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Email</label>
                {{ form.username }}
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
                {{ form.password }}
            </div>

            <div class="pt-2">
                <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold text-xs py-3 rounded-lg transition shadow-sm">
                    Masuk ke Sistem
                </button>
            </div>
        </form>

        <!-- Tombol Kembali ke Beranda -->
        <div class="text-center pt-2 border-t border-slate-100">
            <a href="{% url 'landing:landing_home' %}" class="text-teal-600 hover:text-teal-700 text-xs font-medium transition inline-flex items-center gap-1">
                &larr; Kembali ke Beranda
            </a>
        </div>

    </div>

</body>
</html>
