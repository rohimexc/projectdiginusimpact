<!-- OVERLAY BACKDROP UNTUK MOBILE & TABLET (< md) -->
<div id="adminSidebarOverlay" class="fixed inset-0 bg-slate-950/60 backdrop-blur-xs z-40 hidden opacity-0 transition-opacity duration-300 md:hidden"></div>

<!-- SIDEBAR ADMIN RESPONSIVE (DESKTOP: STATIC, MOBILE/TABLET: OFF-CANVAS SLIDE-OVER) -->
<aside id="adminSidebar" class="fixed md:static inset-y-0 left-0 z-50 w-64 bg-[#0f6b6b] text-white flex flex-col justify-between p-6 shadow-2xl md:shadow-xl shrink-0 h-screen border-r border-[#0d5959]/50 overflow-y-auto transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
    <div class="space-y-6">
        <!-- Header Logo & Portal -->
        <div class="flex items-center justify-between pb-5 border-b border-white/15">
            <div class="flex items-center gap-3 min-w-0">
                <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center shadow shrink-0">
                    <span class="text-xs font-bold text-red-600">🏛️</span>
                </div>
                <div>
                    <h2 class="text-sm font-bold text-white tracking-wide leading-tight">Admin Portal</h2>
                    <p class="text-amber-300 text-[10px] font-semibold tracking-wider uppercase">Administrasi Publik</p>
                </div>
            </div>
            <!-- Tombol Close Sidebar Khusus Mobile / Tablet -->
            <button id="adminSidebarCloseBtn" type="button" aria-label="Tutup Menu" class="md:hidden w-8 h-8 rounded-lg bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition focus:outline-none">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
        </div>

                <i class="fa-solid fa-gauge text-xs w-4 text-center group-hover:text-amber-300 {% if request.resolver_match.url_name == 'dashboard_admin' %}text-amber-300{% else %}text-teal-200{% endif %} transition"></i>
                <span>Dashboard Utama</span>
            </a>

            <a href="{% url 'landing:dashboard_berita' %}"

                <i class="fa-solid fa-newspaper text-xs w-4 text-center group-hover:text-amber-300 {% if request.resolver_match.url_name == 'dashboard_berita' %}text-amber-300{% else %}text-teal-200{% endif %} transition"></i>
                <span>Kelola Berita</span>

                <i class="fa-solid fa-user-tie text-xs w-4 text-center group-hover:text-amber-300 {% if request.resolver_match.url_name == 'tenaga_pendidik' %}text-amber-300{% else %}text-teal-200{% endif %} transition"></i>
                <span>Kelola Tendik</span>
            </a>

                <span>Kelola Dosen</span>

                class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl transition duration-200 group {% if 'cms/pages' in request.path %}bg-[#0a4f4f] text-amber-300 font-semibold shadow-inner border-l-4 border-amber-300{% else %}text-slate-100 hover:text-amber-300 hover:bg-[#0c5959]/70{% endif %}">

    <!-- Tombol Logout -->
    <div class="pt-4 border-t border-white/15">
        <form action="{% url 'landing:logout' %}" method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{% url 'landing:login' %}">
            <button type="submit"
                class="w-full flex items-center gap-3 px-3.5 py-2.5 text-xs text-red-200 hover:text-amber-300 hover:bg-white/10 rounded-xl transition duration-200 font-semibold group cursor-pointer">
