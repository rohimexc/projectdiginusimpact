{% extends 'landing/admin/template/base.html' %}
{% block content %}
<div class="max-w-5xl mx-auto px-4 py-8">
    <!-- Kotak Form Utama -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-8">
        <div class="mb-6 pb-4 border-b border-slate-100">
            <h2 class="text-xl font-bold text-slate-800">{% if tendik %}Ubah Data Tendik{% else %}Tambah Tendik Baru{% endif %}</h2>
            <p class="text-xs text-slate-500 mt-1">Lengkapi profil tenaga kependidikan untuk portal akademik</p>
        </div>

        <form method="POST" enctype="multipart/form-data" class="space-y-5">
            {% csrf_token %}

            <!-- Grid 2 Kolom -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                
                <!-- Nama Lengkap & Gelar -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-700">Nama Lengkap & Gelar *</label>
                    <input type="text" name="nama" value="{{ tendik.nama|default:'' }}" required 
                           class="w-full px-3.5 py-2.5 text-xs bg-slate-50/50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-600 focus:bg-white transition" placeholder="Nama lengkap & gelar">
                </div>

                <!-- Jenis Kelamin (Dropdown) -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-700">Jenis Kelamin</label>
                    <select name="jk" class="w-full px-3.5 py-2.5 text-xs bg-slate-50/50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-600 focus:bg-white transition">
                        <option value="L" {% if tendik.jk == 'L' %}selected{% endif %}>Laki-laki</option>
                        <option value="P" {% if tendik.jk == 'P' %}selected{% endif %}>Perempuan</option>
                    </select>
                </div>

                <!-- Bidang Ilmu / Unit Kerja -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-700">Bidang Ilmu / Unit Kerja</label>
                    <input type="text" name="kategori" value="{{ tendik.kategori|default:'' }}" 
                           class="w-full px-3.5 py-2.5 text-xs bg-slate-50/50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-600 focus:bg-white transition" placeholder="Bidang keilmuan / jabatan kerja">
                </div>

                <!-- Status Kepegawaian (Dropdown) -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-700">Status Kepegawaian</label>
                    <select name="status" class="w-full px-3.5 py-2.5 text-xs bg-slate-50/50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-600 focus:bg-white transition">
                        <option value="DOSEN TETAP" {% if tendik.status == 'DOSEN TETAP' %}selected{% endif %}>DOSEN TETAP</option>
                        <option value="DOSEN LUAR BIASA" {% if tendik.status == 'DOSEN LUAR BIASA' %}selected{% endif %}>DOSEN LUAR BIASA</option>
                        <option value="STAF ADMINISTRASI" {% if tendik.status == 'STAF ADMINISTRASI' %}selected{% endif %}>STAF ADMINISTRASI</option>
                        <option value="TENAGA KEPENDIDIKAN" {% if tendik.status == 'TENAGA KEPENDIDIKAN' %}selected{% endif %}>TENAGA KEPENDIDIKAN</option>
                    </select>
                </div>

                <!-- Pangkat / Golongan (Dropdown) -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-700">Pangkat / Golongan</label>
                    <select name="pangkat" class="w-full px-3.5 py-2.5 text-xs bg-slate-50/50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-600 focus:bg-white transition">
                        <option value="">-- Pilih Pangkat / Golongan --</option>
                        <option value="Juru Muda / I.a" {% if tendik.pangkat == 'Juru Muda / I.a' %}selected{% endif %}>Juru Muda / I.a</option>
                        <option value="Juru Muda Tingkat I / I.b" {% if tendik.pangkat == 'Juru Muda Tingkat I / I.b' %}selected{% endif %}>Juru Muda Tingkat I / I.b</option>
                        <option value="Juru / I.c" {% if tendik.pangkat == 'Juru / I.c' %}selected{% endif %}>Juru / I.c</option>
                        <option value="Juru Tingkat I / I.d" {% if tendik.pangkat == 'Juru Tingkat I / I.d' %}selected{% endif %}>Juru Tingkat I / I.d</option>
                        <option value="Pengatur Muda / II.a" {% if tendik.pangkat == 'Pengatur Muda / II.a' %}selected{% endif %}>Pengatur Muda / II.a</option>
                        <option value="Pengatur Muda Tingkat I / II.b" {% if tendik.pangkat == 'Pengatur Muda Tingkat I / II.b' %}selected{% endif %}>Pengatur Muda Tingkat I / II.b</option>
                        <option value="Pengatur / II.c" {% if tendik.pangkat == 'Pengatur / II.c' %}selected{% endif %}>Pengatur / II.c</option>
                        <option value="Pengatur Tingkat I / II.d" {% if tendik.pangkat == 'Pengatur Tingkat I / II.d' %}selected{% endif %}>Pengatur Tingkat I / II.d</option>
                        <option value="Penata Muda / III.a" {% if tendik.pangkat == 'Penata Muda / III.a' %}selected{% endif %}>Penata Muda / III.a</option>
                        <option value="Penata Muda Tingkat I / III.b" {% if tendik.pangkat == 'Penata Muda Tingkat I / III.b' %}selected{% endif %}>Penata Muda Tingkat I / III.b</option>
                        <option value="Penata / III.c" {% if tendik.pangkat == 'Penata / III.c' %}selected{% endif %}>Penata / III.c</option>
                        <option value="Penata Tingkat I / III.d" {% if tendik.pangkat == 'Penata Tingkat I / III.d' %}selected{% endif %}>Penata Tingkat I / III.d</option>
                        <option value="Pembina / IV.a" {% if tendik.pangkat == 'Pembina / IV.a' %}selected{% endif %}>Pembina / IV.a</option>
                        <option value="Pembina Tingkat I / IV.b" {% if tendik.pangkat == 'Pembina Tingkat I / IV.b' %}selected{% endif %}>Pembina Tingkat I / IV.b</option>
                        <option value="Pembina Utama Madya / IV.c" {% if tendik.pangkat == 'Pembina Utama Madya / IV.c' %}selected{% endif %}>Pembina Utama Madya / IV.c</option>
                        <option value="Pembina Utama Muda / IV.d" {% if tendik.pangkat == 'Pembina Utama Muda / IV.d' %}selected{% endif %}>Pembina Utama Muda / IV.d</option>
                        <option value="Pembina Utama / IV.e" {% if tendik.pangkat == 'Pembina Utama / IV.e' %}selected{% endif %}>Pembina Utama / IV.e</option>
                    </select>
                </div>

                <!-- Email -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-700">Email</label>
                    <input type="email" name="email" value="{{ tendik.email|default:'' }}" 
                           class="w-full px-3.5 py-2.5 text-xs bg-slate-50/50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-600 focus:bg-white transition" placeholder="email@untad.ac.id">
                </div>

                <!-- NIP -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-700">NIP (Opsional)</label>
                    <input type="text" name="nip" value="{{ tendik.nip|default:'' }}" 
                           class="w-full px-3.5 py-2.5 text-xs bg-slate-50/50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-600 focus:bg-white transition" placeholder="Nomor NIP (opsional)">
                </div>

                <!-- NIDN / NUPTK -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-700">NIDN / NUPTK (Opsional)</label>
                    <input type="text" name="nidn" value="{{ tendik.nidn|default:'' }}" 
                           class="w-full px-3.5 py-2.5 text-xs bg-slate-50/50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-600 focus:bg-white transition" placeholder="Nomor NIDN (opsional)">
                </div>

                <!-- No WhatsApp -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-700">No. WhatsApp / HP</label>
                    <input type="text" name="telepon" value="{{ tendik.telepon|default:'' }}" 
                           class="w-full px-3.5 py-2.5 text-xs bg-slate-50/50 border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-600 focus:bg-white transition" placeholder="0812xxxxxxxx">
                </div>

                <!-- Foto Profil -->
                <div class="space-y-1.5">
                    <label class="block text-xs font-semibold text-slate-700">Foto Profil</label>
                    <input type="file" name="foto" 
                           class="w-full px-3 py-1.5 text-xs bg-slate-50/50 border border-slate-300 rounded-xl file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-teal-50 file:text-teal-700 hover:file:bg-teal-100 transition">
                </div>

            </div>

            <!-- Tombol Aksi Bawah -->
            <div class="flex items-center justify-end space-x-3 pt-6 border-t border-slate-100 mt-6">
                <a href="{% url 'landing:tenaga_pendidik' %}" class="px-5 py-2.5 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 text-xs font-semibold rounded-xl transition">Batal</a>
                <button type="submit" class="px-6 py-2.5 bg-teal-800 hover:bg-teal-900 text-white text-xs font-semibold rounded-xl transition shadow-sm">Simpan Data Tendik</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
