<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasar JavaScript</title>
</head>
<body>
    <h1>Hello, World!</h1>

    <!-- ini adalah penggunaan javascript inline -->
    <button onclick="console.log('Saya diklik!');">
        Click Me
    </button>
    
    <!-- ini adalah contoh penggunaan JavaScript menggunakan tag script -->
    <script>
        console.log("Hello, World!");
        console.log("Ini adalah contoh penggunaan JavaScript di dalam HTML.");
    </script>

    <!-- ini adalah contoh penggunaan JavaScript menggunakan file eksternal -->
    <script src="script.js"></script>
</body>
</html>
