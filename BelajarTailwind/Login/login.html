<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Professional UI</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="login.css">
</head>
<body class="bg-slate-400 min-h-screen flex items-center justify-center p-4">

    <!-- Card Utama Login (Single Column, Senada dengan Register) -->
    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-8 md:p-10 border border-slate-100 relative overflow-hidden">
        
        <!-- Hiasan subtle glow yang kalem di pojok atas -->
        <div class="absolute -top-12 -right-12 w-32 h-32 bg-blue-500/10 rounded-full blur-xl"></div>

        <div class="text-center mb-8 relative z-10">
            <h2 class="text-3xl font-extrabold text-slate-900 tracking-tight">Welcome Back</h2>
            <p class="text-slate-500 text-xs mt-1">Please enter your credentials to continue</p>
            <div class="w-12 h-1 bg-blue-600 mx-auto mt-3 rounded-full"></div>
        </div>

        <form id="loginForm" class="space-y-4 relative z-10">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Email Address</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 text-sm">✉</span>
                    <input type="email" id="loginEmail" required class="w-full pl-10 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent text-sm bg-slate-50/50 transition" placeholder="name@example.com">
                </div>
            </div>
            
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-600 mb-1">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 text-sm">🔒</span>
                    <input type="password" id="loginPassword" required class="w-full pl-10 pr-10 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent text-sm bg-slate-50/50 transition" placeholder="••••••••">
                </div>
            </div>

            <div class="flex items-center justify-between text-xs py-1">
                <label class="flex items-center space-x-2 text-slate-600 cursor-pointer">
                    <input type="checkbox" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                    <span>Remember me</span>
                </label>
                <a href="#" class="text-blue-600 font-medium hover:underline">Forgot Password?</a>
            </div>

<button type="submit" class="w-full bg-blue-600 hover:bg-blue-800 text-white font-medium py-3 rounded-xl transition-all duration-300 shadow-md hover:shadow-xl shadow-blue-600/30 hover:shadow-blue-600/50 hover:-translate-y-0.5 text-sm">
    Sign In →
</button>
        </form>

        <div class="relative flex py-4 items-center">
            <div class="flex-grow border-t border-slate-100"></div>
            <span class="flex-shrink mx-4 text-slate-400 text-[10px] uppercase tracking-widest">Or</span>
            <div class="flex-grow border-t border-slate-100"></div>
        </div>

        <p class="text-center text-xs text-slate-500">
            Don't have an account? <a href="../register/register.html" class="text-blue-600 font-semibold hover:underline">Register</a>
        </p>

    </div>

    <script src="login.js"></script>
</body>
</html>
