<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Login UI - Tailwind</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="login.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
          },
        },
      },
    };
  </script>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-4 font-sans relative overflow-x-hidden selection:bg-purple-500 selection:text-white">

  <!-- Background Animated Glowing Blobs -->
  <div class="fixed top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-72 h-72 bg-purple-300/40 rounded-full blur-3xl pointer-events-none animate-blob"></div>
  <div class="fixed bottom-1/4 left-1/2 -translate-x-1/3 translate-y-1/3 w-72 h-72 bg-blue-300/40 rounded-full blur-3xl pointer-events-none animate-blob animation-delay-2000"></div>
  
  <!-- Main Card -->
  <div class="relative w-full max-w-sm bg-white/90 backdrop-blur-md rounded-3xl p-7 shadow-2xl shadow-purple-500/10 border border-purple-200/80 z-10 card-dot-pattern">
    
    <!-- Card Header -->
    <div class="text-center mb-6">
      <h2 class="text-3xl font-extrabold bg-gradient-to-r from-purple-600 to-blue-500 bg-clip-text text-transparent">
        Welcome Back
      </h2>
      <p class="text-slate-500 text-sm mt-1 mb-3">Login to your account</p>
      <div class="w-12 h-1 mx-auto rounded-full bg-gradient-to-r from-purple-400 to-blue-500"></div>
    </div>

    <!-- Form -->
    <form id="loginForm" class="space-y-4">
      
      <!-- Email Field -->
      <div class="relative">
        <label for="email" class="absolute -top-2.5 left-4 bg-white px-1.5 text-xs font-semibold text-purple-600 z-10">
          Email
        </label>
        <div class="flex items-center border border-purple-300 rounded-xl px-3.5 py-3 focus-within:border-purple-600 focus-within:ring-2 focus-within:ring-purple-200 bg-white transition duration-200">
          <i class="fa-regular fa-envelope text-purple-500 mr-3 text-sm"></i>
          <input 
            type="email" 
            id="email" 
            placeholder="example@mail.com" 
            class="w-full text-sm text-slate-800 placeholder-slate-400 outline-none bg-transparent" 
            required 
          />
        </div>
      </div>

      <!-- Password Field -->
      <div class="relative">
        <div class="flex items-center border border-purple-300 rounded-xl px-3.5 py-3 focus-within:border-purple-600 focus-within:ring-2 focus-within:ring-purple-200 bg-white transition duration-200">
          <i class="fa-solid fa-lock text-purple-500 mr-3 text-sm"></i>
          <input 
            type="password" 
            id="password" 
            placeholder="Password" 
            class="w-full text-sm text-slate-800 placeholder-slate-400 outline-none bg-transparent" 
            required 
          />
          <button type="button" id="togglePassword" class="text-purple-500 hover:text-purple-700 transition" aria-label="Toggle password">
            <i class="fa-regular fa-eye" id="eyeIcon"></i>
          </button>
        </div>
      </div>

      <!-- Options -->
      <div class="flex items-center justify-between text-xs pt-1">
        <label class="flex items-center gap-2 cursor-pointer select-none text-slate-600 font-medium">
          <input type="checkbox" id="rememberMe" class="w-4 h-4 rounded border-purple-300 text-purple-600 focus:ring-purple-400 accent-purple-600" />
          <span>Remember me</span>
        </label>
        <a href="#" class="text-indigo-600 hover:underline font-medium">Forgot Password?</a>
      </div>

      <!-- Submit Button -->
      <button 
     type="submit" 
     class="group relative w-full mt-2 py-3.5 px-4 bg-gradient-to-r from-fuchsia-600 via-purple-600 to-blue-600 text-white font-semibold rounded-xl flex items-center justify-center gap-2 shadow-lg shadow-purple-500/30 transition-all duration-300 hover:shadow-xl hover:shadow-purple-500/60 hover:-translate-y-1 hover:brightness-110 active:scale-[0.98]">
    <span>Login</span>
        <i class="fa-solid fa-arrow-right text-xs transition-transform duration-300 group-hover:translate-x-1.5"></i>
    </button>
    </form>

    <!-- OR Divider -->
    <div class="flex items-center my-5">
      <div class="flex-grow border-t border-slate-200"></div>
      <span class="px-3 text-xs font-semibold text-slate-400">OR</span>
      <div class="flex-grow border-t border-slate-200"></div>
    </div>

    <!-- Sign up Link -->
    <p class="text-center text-xs text-slate-500">
      Don't have an account? 
      <a href="register.html" class="font-semibold text-purple-600 hover:underline ml-1">Sign up</a>
    </p>
  </div>

  <script src="login.js"></script>
</body>
</html>
