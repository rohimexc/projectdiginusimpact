{% extends 'base.html' %}
{% load static %}

{% block head_title %}{{ title }}{% endblock head_title %}

{% block content %}
<img src="{% static banner %}" alt="Logo" width="50%" >
    <h1>{{ title }}</h1>
    <p>{{ content }}</p>

    <ul>
    {% for link, name in navbar %}
        <li><a href="{{ link }}">{{ name }}</a></li>
    {% endfor %}
    </ul>
{% endblock content %}
