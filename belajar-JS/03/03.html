<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menjalankan JavaScript</title>
</head>
<body>

    <h1>hello world Abang Otong</h1>

    <!-- 1. JavaScript Inline pada Elemen/Button -->
    <button onclick="console.log('saya diklik')">klik saya</button>

    <!-- 2. JavaScript menggunakan Tag <script> langsung -->
    <script>
        // Menuliskan kode JS langsung di dalam tag script
        console.log("Hello manis");
        console.log("ini adalah javascript dari tag script");
    </script>

    <!-- 3. JavaScript Eksternal (Mengambil dari file script.js) -->
    <script src="script.js"></script>

</body>
</html>
